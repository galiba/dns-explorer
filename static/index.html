<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNS Explorer</title>
<style>
:root{--bg:#0a0e17;--panel:#111826;--line:#1f2b3d;--txt:#c9d4e3;--mut:#6b7c93;--acc:#4f9cf9;--grn:#3ddc84;--red:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px}
h1{margin:0;font-size:20px;letter-spacing:.5px}h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:12px}
form{display:flex;flex-wrap:wrap;gap:10px;padding:20px 28px;border-bottom:1px solid var(--line);align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut)}
input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:6px;font:inherit;min-width:220px}
input:focus{outline:none;border-color:var(--acc)}
.chk{flex-direction:row;align-items:center;gap:6px;color:var(--txt)}
button{background:var(--acc);color:#04121f;border:0;padding:9px 18px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
#meta{padding:10px 28px;color:var(--mut);font-size:12px;display:none;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#meta b{color:var(--txt)}
#tabs{display:none;gap:8px;padding:12px 28px 0}
#tabs button{background:var(--panel);color:var(--mut);border:1px solid var(--line);padding:6px 16px;font-weight:600}
#tabs button.on{color:var(--acc);border-color:var(--acc)}
.wrap{overflow:auto;padding:0 28px 40px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
td{padding:8px 10px;border-bottom:1px solid #131c2b;vertical-align:top;white-space:pre-line}
tr:hover td{background:#0e1626}
.host{color:var(--grn)}.ip{color:var(--acc)}.type{color:var(--mut)}
.internal{color:#ffb454;font-weight:600}.public{color:var(--grn)}
.err{color:var(--red);padding:16px 28px}
.spin{color:var(--acc);padding:16px 28px;display:none}
/* resolving overlay */
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(10,14,23,.55);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#overlay.on{display:flex}
.ov-card{display:flex;flex-direction:column;align-items:center;gap:20px;padding:36px 44px;text-align:center;
  min-width:340px;max-width:540px;background:rgba(17,24,38,.92);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.spinner{width:46px;height:46px;border:3px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ov-title{color:var(--acc);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.ov-msg{color:var(--txt);font-size:15px;line-height:1.5;min-height:44px;transition:opacity .2s}
.ov-sub{color:var(--mut);font-size:12px}.ov-dom{color:var(--grn)}
.ov-dots{display:flex;gap:6px}
.ov-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s}
.ov-dots i.on{background:var(--acc)}
/* graph */
#graph{display:none;padding:14px 28px 60px;overflow:auto}
.gedge{fill:none;stroke:#2a3a52;stroke-width:1}
.gn{stroke-width:1.5;rx:4}
.gn.domain{fill:#2a1616;stroke:#7a3b3b}
.gn.type{fill:#141c2b;stroke:#5a6b86}
.gn.host{fill:#0f1c14;stroke:var(--grn)}
.gn.ip{fill:#0e1830;stroke:var(--acc)}
.gn.int{fill:#241a08;stroke:#ffb454}
.gn.rev{fill:#1a1226;stroke:#a678d6}
.gn.val{fill:#151515;stroke:#7a6a3b}
.gn.shared{stroke-width:3}
.gt{font:11px ui-monospace,Menlo,monospace;fill:var(--txt)}
.gt.domain{fill:#e0a0a0}.gt.host{fill:var(--grn)}.gt.ip{fill:#9fc4ff}.gt.int{fill:#ffb454}.gt.rev{fill:#c8a6ec}.gt.type{fill:#aab8cc}
#graph g[data-fk]{cursor:pointer}
#graph g[data-fk]:hover .gn{stroke-width:2.5;filter:brightness(1.4)}
#filter{display:none;align-items:center;gap:10px;padding:10px 28px;font-size:12px;color:var(--mut)}
#filter .chip{background:var(--panel);border:1px solid var(--acc);color:var(--acc);border-radius:14px;padding:3px 10px}
#filter .x{cursor:pointer;color:var(--red);font-weight:700}
</style></head><body>
<header><h1>DNS<span>Explorer</span></h1><span class="sub">zone-transfer (AXFR) &amp; passive discovery · internal NS · graph &amp; xlsx export</span></header>
<form id="f">
  <label>Domain<input id="domain" type="text" placeholder="example.com" required></label>
  <label>Nameserver / internal DNS (optional)<input id="resolver" type="text" placeholder="10.0.0.53 (AXFR target &amp; resolver)"></label>
  <label class="chk"><input id="passive" type="checkbox" checked> Passive (crt.sh)</label>
  <label class="chk"><input id="grab" type="checkbox" checked> HTTP banner grab</label>
  <button id="go" type="submit">Scan</button>
  <button id="dl" class="ghost" type="button" disabled>Export .xlsx</button>
  <button id="png" class="ghost" type="button" disabled>Export .png</button>
</form>
<div id="meta"></div>
<div id="tabs"><button id="tabTable" class="on">Table</button><button id="tabGraph">Graph</button></div>
<div id="filter"></div>
<div id="err" class="err"></div>
<div id="overlay"><div class="ov-card">
  <div class="spinner"></div>
  <div class="ov-title">Resolving</div>
  <div id="ovMsg" class="ov-msg">Starting scan…</div>
  <div class="ov-dots" id="ovDots"></div>
  <div class="ov-sub">Mapping <span id="ovDom" class="ov-dom"></span> — a scan usually takes a few seconds</div>
</div></div>
<div class="wrap"><table id="t" style="display:none">
<thead><tr><th>Host</th><th>Type</th><th>Value / IP</th><th>Scope</th><th>View</th><th>Reverse DNS</th><th>Netblock Owner</th><th>HTTP Services</th><th>Source</th></tr></thead>
<tbody></tbody></table></div>
<div id="graph"></div>
<script>
let last=null;
const $=id=>document.getElementById(id);
$('f').addEventListener('submit',async e=>{
  e.preventDefault();
  $('err').textContent='';$('t').style.display='none';$('meta').style.display='none';$('tabs').style.display='none';
  ovStart($('domain').value.trim()||'the domain');$('go').disabled=true;$('dl').disabled=true;$('png').disabled=true;
  const body={domain:$('domain').value,resolver:$('resolver').value||null,grab_http:$('grab').checked,passive:$('passive').checked};
  try{
    const r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok||d.error){throw new Error(d.error||'scan failed')}
    last=d;render(d);
  }catch(err){$('err').textContent='⚠ '+err.message}
  finally{ovStop();$('go').disabled=false}
});
// resolving overlay: narrate the real pipeline stages while the request is in flight
const OV_STEPS=[
  "Querying the nameservers for the base records — A, AAAA, MX, NS, TXT, SOA.",
  "Attempting a DNS zone transfer (AXFR) to dump the full zone from the nameservers.",
  "Checking whether the domain uses wildcard DNS, so bogus names get flagged.",
  "Searching certificate transparency logs — crt.sh, Cert Spotter, CertKit, HackerTarget.",
  "Resolving every discovered hostname to its IP address across the resolvers.",
  "Looking up reverse DNS (PTR) and the ASN / netblock owner for each IP.",
  "Grabbing HTTP and HTTPS server banners to fingerprint what's running.",
  "Flagging internal vs public IPs and assembling the results and graph.",
];
let ovTimer=null, ovI=0;
function ovStart(dom){
  $('ovDom').textContent=dom; ovI=0; $('ovMsg').textContent=OV_STEPS[0];
  $('ovDots').innerHTML=OV_STEPS.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
  $('overlay').classList.add('on');
  clearInterval(ovTimer);
  ovTimer=setInterval(()=>{
    ovI=Math.min(ovI+1,OV_STEPS.length-1);
    const el=$('ovMsg'); el.style.opacity=0;
    setTimeout(()=>{el.textContent=OV_STEPS[ovI];el.style.opacity=1;},180);
    [...$('ovDots').children].forEach((d,i)=>d.classList.toggle('on',i<=ovI));
  },1700);
}
function ovStop(){ clearInterval(ovTimer); ovTimer=null; $('overlay').classList.remove('on'); }
$('dl').addEventListener('click',async()=>{
  if(!last)return;
  const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(last)});
  const b=await r.blob();const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=last.domain+'-dns.xlsx';a.click();URL.revokeObjectURL(u);
});
$('png').addEventListener('click',()=>{
  if(!last)return;
  if(!$('graph').dataset.rendered){renderGraph(last);$('graph').dataset.rendered='1'}
  const svg=$('graph').querySelector('svg'); if(!svg)return;
  const W=+svg.getAttribute('width'), H=+svg.getAttribute('height'), scale=2;
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=W*scale; c.height=H*scale;
    const ctx=c.getContext('2d'); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    URL.revokeObjectURL(url);
    c.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');
      a.href=u;a.download=last.domain+'-dns-graph.png';a.click();URL.revokeObjectURL(u)},'image/png');
  };
  img.onerror=()=>{URL.revokeObjectURL(url);$('err').textContent='⚠ PNG export failed'};
  img.src=url;
});
$('tabTable').onclick=()=>showView('table');
$('tabGraph').onclick=()=>showView('graph');
function showView(v){
  const g=v==='graph';
  $('t').style.display=g?'none':'table';
  $('graph').style.display=g?'block':'none';
  $('tabGraph').classList.toggle('on',g);$('tabTable').classList.toggle('on',!g);
  if(g && !$('graph').dataset.rendered){renderGraph(last);$('graph').dataset.rendered='1'}
}
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(d){
  const ns=(d.apex.NS||[]).map(x=>x.replace(/\.$/,'')).join(', ')||'—';
  let m=`<span>domain <b>${esc(d.domain)}</b></span><span>resolver <b>${esc(d.resolver)}</b></span>`+
    `<span>records <b>${d.rows.length}</b></span>`+
    `<span>scope <b class="internal">${d.counts?d.counts.internal:0} internal</b> / <b class="public">${d.counts?d.counts.public:0} public</b></span>`+
    `<span>method <b>${esc(d.method)}</b></span><span>NS <b>${esc(ns)}</b></span>`;
  if(d.passive_sources){
    const ps=Object.entries(d.passive_sources).map(([k,v])=>{
      const col=v==='err'?'var(--red)':(v>0?'var(--grn)':'var(--mut)');
      return `${esc(k)}:<b style="color:${col}">${esc(String(v))}</b>`;
    }).join('  ');
    m+=`<span>passive sources ${ps}</span>`;
  }
  const ipHosts={};
  for(const r of d.rows) if(r.type==='A'||r.type==='AAAA'){(ipHosts[r.value] ||= new Set()).add(r.host)}
  const sharedIPs=Object.values(ipHosts).filter(s=>s.size>1).length;
  if(sharedIPs) m+=`<span>shared IPs <b class="internal">${sharedIPs}</b> (hosting &gt;1 host)</span>`;
  if(d.wildcard) m+=`<span style="color:var(--red)">⚠ wildcard DNS detected — unlisted names may resolve</span>`;
  $('meta').innerHTML=m; $('meta').style.display='flex';
  filter=null; fillTable(); renderChip();
  $('dl').disabled=false;$('png').disabled=false;
  $('tabs').style.display='flex';$('graph').dataset.rendered='';$('graph').innerHTML='';
  showView('table');
}
let filter=null;  // {field:'host'|'type'|'value', val}
function matchFilter(r){return !filter || r[filter.field]===filter.val}
function fillTable(){
  const tb=$('t').querySelector('tbody');tb.innerHTML='';
  for(const row of last.rows){
    if(!matchFilter(row))continue;
    const tr=document.createElement('tr');
    const val=esc(row.value); const isip=row.type==='A'||row.type==='AAAA';
    tr.innerHTML=`<td class="host">${esc(row.host)}</td><td class="type">${esc(row.type)}</td>`+
      `<td class="${isip?'ip':''}">${val}</td><td class="${esc(row.scope)}">${esc(row.scope)}</td>`+
      `<td class="type">${esc(row.view)}</td><td>${esc(row.reverse)}</td>`+
      `<td>${esc(row.owner).replace(/\n/g,'<br>')}</td><td>${esc(row.http).replace(/\n/g,'<br>')}</td>`+
      `<td class="type">${esc(row.source)}</td>`;
    tb.appendChild(tr);
  }
  $('t').style.display='table';
}
function renderChip(){
  const f=$('filter');
  if(!filter){f.style.display='none';f.innerHTML='';return}
  const n=last.rows.filter(matchFilter).length;
  f.innerHTML=`filtering <span class="chip">${esc(filter.field)} = ${esc(filter.val)}</span> `+
    `<span>${n} record${n===1?'':'s'}</span> <span class="x" id="clr">✕ clear</span>`;
  f.style.display='flex';
  $('clr').onclick=()=>{filter=null;fillTable();renderChip()};
}
function applyFilter(field,val){
  filter=(field==='domain')?null:{field,val};
  fillTable(); renderChip(); showView('table');
  window.scrollTo({top:$('tabs').offsetTop,behavior:'smooth'});
}
$('graph').addEventListener('click',e=>{
  const g=e.target.closest('g[data-fk]'); if(!g)return;
  applyFilter(g.dataset.fk,g.dataset.fv);
});
// clip label to fit column width (~7px per mono char)
function clip(s,w){const max=Math.floor((w-14)/7);return s.length>max?s.slice(0,max-1)+'…':s}
function renderGraph(d){
  const rows=d.rows; if(!rows.length){$('graph').textContent='no records';return}
  const rowH=26, colX=[16,250,340,660,950], colW=[150,60,300,260,260], NH=20;
  const types=[...new Set(rows.map(r=>r.type))];
  let leaf=0; const nodes=[], edges=[], typeNodes=[];
  for(const t of types){
    const trows=rows.filter(r=>r.type===t);
    const hosts=[...new Set(trows.map(r=>r.host))];
    const hostNodes=[];
    for(const h of hosts){
      const vrows=trows.filter(r=>r.host===h);
      const valNodes=[];
      for(const vr of vrows){
        const y=leaf*rowH+30; leaf++;
        const isip=t==='A'||t==='AAAA';
        const cls=isip?(vr.scope==='internal'?'int':'ip'):'val';
        const vn=add(nodes,colX[3],y,colW[3],vr.value,cls);
        valNodes.push(vn);
        if(isip && vr.reverse){                       // reverse DNS / proxy node
          const rn=add(nodes,colX[4],y,colW[4],vr.reverse,'rev');
          edges.push([vn,rn]);
        }
      }
      const hn=add(nodes,colX[2],avg(valNodes),colW[2],h,'host');
      hostNodes.push(hn); valNodes.forEach(v=>edges.push([hn,v]));
    }
    const tn=add(nodes,colX[1],avg(hostNodes),colW[1],t,'type');
    typeNodes.push(tn); hostNodes.forEach(h=>edges.push([tn,h]));
  }
  const dn=add(nodes,colX[0],avg(typeNodes),colW[0],d.domain,'domain');
  typeNodes.forEach(t=>edges.push([dn,t]));

  // coalesce duplicate IP / reverse nodes so a shared IP or proxy becomes ONE
  // node that many hosts fan into (turns the tree into a DAG showing shared hosting)
  function coalesce(classes){
    const g={};
    for(const n of nodes) if(classes.includes(n.cls)) (g[n.label] ||= []).push(n);
    for(const label in g){
      const grp=g[label]; if(grp.length<2) continue;
      const rep=grp[0]; rep.y=avg(grp);
      const dups=new Set(grp.slice(1));
      for(const e of edges){ if(dups.has(e[0]))e[0]=rep; if(dups.has(e[1]))e[1]=rep; }
      for(const dd of dups){ const i=nodes.indexOf(dd); if(i>=0) nodes.splice(i,1); }
    }
  }
  coalesce(['ip','int']);   // shared IPs
  coalesce(['rev']);        // shared reverse-proxy hostnames
  // de-dup edges and drop self-loops created by coalescing
  const eseen=new Set(), edges2=[];
  for(const[p,c] of edges){ if(p===c)continue; const k=p._id+'>'+c._id; if(eseen.has(k))continue; eseen.add(k); edges2.push([p,c]); }
  edges.length=0; edges.push(...edges2);
  // incoming count = how many distinct hosts/IPs point into this node
  const inc={};
  for(const[p,c] of edges){ (inc[c._id] ||= new Set()).add(p._id); }
  for(const n of nodes){ n.count=inc[n._id]?inc[n._id].size:0; }

  const H=leaf*rowH+50, W=colX[4]+colW[4]+30;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="monospace">`+
    `<style>.gedge{fill:none;stroke:#2a3a52}.gn{stroke-width:1.5}`+
    `.gn.domain{fill:#2a1616;stroke:#7a3b3b}.gn.type{fill:#141c2b;stroke:#5a6b86}`+
    `.gn.host{fill:#0f1c14;stroke:#3ddc84}.gn.ip{fill:#0e1830;stroke:#4f9cf9}.gn.int{fill:#241a08;stroke:#ffb454}.gn.rev{fill:#1a1226;stroke:#a678d6}.gn.val{fill:#151515;stroke:#7a6a3b}`+
    `.gn.shared{stroke-width:3}`+
    `.gt{font:11px monospace;fill:#c9d4e3}.gt.domain{fill:#e0a0a0}.gt.host{fill:#3ddc84}.gt.ip{fill:#9fc4ff}.gt.int{fill:#ffb454}.gt.rev{fill:#c8a6ec}.gt.type{fill:#aab8cc}.gt.count{fill:#ffd479}</style>`+
    `<rect width="${W}" height="${H}" fill="#0a0e17"/>`;
  for(const[p,c] of edges){
    const x1=p.x+p.w,y1=p.y+NH/2,x2=c.x,y2=c.y+NH/2,mx=(x1+x2)/2;
    s+=`<path class="gedge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  }
  const fk={domain:'domain',type:'type',host:'host',ip:'value',int:'value',val:'value',rev:'reverse'};
  for(const n of nodes){
    const shared=n.count>1, badge=shared?`  ×${n.count}`:'';
    const lw=shared?n.w-34:n.w;   // leave room for the count badge
    const tip=shared?`${esc(n.label)} — ${n.count} hosts share this — click to filter`
                    :`${esc(n.label)} — click to filter`;
    s+=`<g data-fk="${fk[n.cls]}" data-fv="${esc(n.label).replace(/"/g,'&quot;')}"><title>${tip}</title>`+
      `<rect class="gn ${n.cls}${shared?' shared':''}" x="${n.x}" y="${n.y}" width="${n.w}" height="${NH}" rx="4"/>`+
      `<text class="gt ${n.cls}" x="${n.x+7}" y="${n.y+14}">${esc(clip(n.label,lw))}</text>`+
      (shared?`<text class="gt count" x="${n.x+n.w-8}" y="${n.y+14}" text-anchor="end">×${n.count}</text>`:'')+
      `</g>`;
  }
  $('graph').innerHTML=s+'</svg>';
}
let _nid=0;
function add(arr,x,y,w,label,cls){const n={_id:_nid++,x,y,w,label,cls};arr.push(n);return n}
function avg(ns){return ns.reduce((a,n)=>a+n.y,0)/ns.length}
</script></body></html>
